[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "effort-estimation-api"
version = "0.1.0"
description = "Effort Estimation and Sprint Risk Predictor: API service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

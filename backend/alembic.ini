# Alembic's command line, run from backend/ (the service applies the migrations itself at start-up). The database
# comes from the service's settings (DATABASE_URL or backend/.env, else the local effort-db), not from this file.
# New migration after changing app/tables.py, against the local database:
#   alembic revision --autogenerate -m "what changed"
[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .

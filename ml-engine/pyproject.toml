[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erp"
version = "0.1.0"
description = "Effort Estimation and Sprint Risk Predictor: data pipeline, labels, features and models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pymysql>=1.1",
  "cryptography>=42", # MySQL 8 caching_sha2_password authentication
  "openpyxl>=3.1", # the review workbooks
  "scikit-learn>=1.5",
  "lightgbm>=4.7", # eval_X / eval_y
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Text encoders that download pre-trained models (E3 SBERT; later E4). Install the CPU build of torch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
encoders = ["sentence-transformers>=3", "torch>=2.4"]
# What the prediction service needs for the configurations the router picks: FastText + LightGBM and TF-IDF with
# a random forest or an SVM.
serving = ["gensim>=4.4", "skops>=0.10"]
# The service's other configurations: the SBERT ones, M3 and the stack (install the CPU build of torch first).
serving-sbert = ["xgboost>=3", "catboost>=1.2", "safetensors>=0.4", "sentence-transformers>=3", "torch>=2.4"]
# The Phase 4 arena: the serving learners plus tuning and experiment tracking. The multi-task network (M3) also
# needs torch from the encoders extra.
arena = ["xgboost>=3", "catboost>=1.2", "gensim>=4.4", "optuna>=4", "mlflow>=3", "skops>=0.10", "safetensors>=0.4"]

[project.scripts]
erp-export-tawos = "erp.extract.tawos_to_parquet:main"
erp-profile-tawos = "erp.explore.profile_tawos:main"
erp-build-timeline = "erp.snapshot.build_timeline:main"
erp-build-snapshot = "erp.snapshot.build_snapshot:main"
erp-build-labels = "erp.labels.build_labels:main"
erp-review-sample = "erp.labels.review:main"
erp-build-features = "erp.features.build_features:main"
erp-train-first = "erp.models.first_models:main"
erp-train-bundle = "erp.models.train_bundle:main"
erp-train-arena = "erp.arena.train:main"
erp-arena-report = "erp.arena.report:main"
erp-run-hypotheses = "erp.arena.hypotheses:main"
erp-fit-intervals = "erp.arena.intervals:main"
erp-history-parity = "erp.serving.replay:main"
erp-unseen-projects = "erp.arena.unseen:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No .pytest_cache inside the repository.
addopts = "-p no:cacheprovider"

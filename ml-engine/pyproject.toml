[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erp"
version = "0.1.0"
description = "Effort Estimation and Sprint Risk Predictor: data pipeline, labels, features and models"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pymysql>=1.1",
  "cryptography>=42", # MySQL 8 caching_sha2_password authentication
  "openpyxl>=3.1", # the review workbooks
  "scikit-learn>=1.5",
  "lightgbm>=4.7", # eval_X / eval_y
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Text encoders that download pre-trained models (E3 SBERT; later E4). Install the CPU build of torch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
encoders = ["sentence-transformers>=3", "torch>=2.4"]

[project.scripts]
erp-export-tawos = "erp.extract.tawos_to_parquet:main"
erp-profile-tawos = "erp.explore.profile_tawos:main"
erp-build-timeline = "erp.snapshot.build_timeline:main"
erp-build-snapshot = "erp.snapshot.build_snapshot:main"
erp-build-labels = "erp.labels.build_labels:main"
erp-review-sample = "erp.labels.review:main"
erp-build-features = "erp.features.build_features:main"
erp-train-first = "erp.models.first_models:main"
erp-train-bundle = "erp.models.train_bundle:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No .pytest_cache inside the repository.
addopts = "-p no:cacheprovider"
